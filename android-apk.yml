
name: Build Tahweelati USSD APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Flutter project
        run: |
          test -f Tahweelati_USSD_Flutter_Project.zip
          unzip -t Tahweelati_USSD_Flutter_Project.zip
          unzip -q Tahweelati_USSD_Flutter_Project.zip -d extracted
          test -f extracted/Tahweelati_Flutter_V2/pubspec.yaml
          test -f extracted/Tahweelati_Flutter_V2/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Generate Android platform
        working-directory: extracted/Tahweelati_Flutter_V2
        run: flutter create --platforms=android --org com.loay --project-name tahweelati .

      - name: Set app display name
        working-directory: extracted/Tahweelati_Flutter_V2
        run: |
          sed -i 's/android:label="tahweelati"/android:label="تحويلاتي USSD"/' android/app/src/main/AndroidManifest.xml

      - name: Configure Android Lint
        working-directory: extracted/Tahweelati_Flutter_V2
        run: python3 scripts/patch_android_gradle.py

      - name: Install Flutter dependencies
        working-directory: extracted/Tahweelati_Flutter_V2
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: extracted/Tahweelati_Flutter_V2
        run: dart run flutter_launcher_icons

      - name: Build release APK
        working-directory: extracted/Tahweelati_Flutter_V2
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tahweelati-USSD-v2.0.0
          path: extracted/Tahweelati_Flutter_V2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
