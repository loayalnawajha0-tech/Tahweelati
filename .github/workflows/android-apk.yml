
name: Build Tahweelati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Tahweelati APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Find and extract project
      - name: Extract Tahweelati project
        run: |
          ZIP_FILE=$(find . -type f \
            -iname 'Tahweelati_CloudBuild_v1.3.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          unzip -t "$ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      # 7. Find Android project directory
      - name: Locate Android project
        id: locate
        run: |
          GRADLE_FILE=$(find project -name settings.gradle.kts \
            -type f -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project found: $PROJECT_DIR"

      # 8. Configure Java and Kotlin target
      - name: Configure JVM target 17
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      # 9. Build APK
      - name: Build Tahweelati APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      # 10. Upload APK
      - name: Upload Tahweelati APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahweelati-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
