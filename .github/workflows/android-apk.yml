
name: Build Tahweelati APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tahweelati-project"

          if [ -f "Tahweelati/settings.gradle.kts" ]; then
            echo "dir=$GITHUB_WORKSPACE/Tahweelati" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP_FILE="$(find . -type f -iname '*tahweelati*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Tahweelati project found." >&2
            find . -maxdepth 3 -type f -not -path './.git/*' -print >&2
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/tahweelati-project"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/tahweelati-project" -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts is missing." >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.project.outputs.dir }}/settings.gradle.kts"
          test -f "${{ steps.project.outputs.dir }}/app/build.gradle.kts"
          echo "Project found successfully"

      - name: Build Debug APK
        shell: bash
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" \
            --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahweelati-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
