
name: Build Tahweelati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project
        run: |
          if [ -f "build.gradle.kts" ] && [ -d "app" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          elif [ -f "Tahweelati/build.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/Tahweelati" >> $GITHUB_ENV
          else
            echo "Project directory not found!"
            find . -maxdepth 3 -name build.gradle.kts
            exit 1
          fi

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Tahweelati.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahweelati-APK
          path: Tahweelati.apk
          if-no-files-found: error
          retention-days: 14
          
