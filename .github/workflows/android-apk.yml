
name: Build Tahweelati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Tahweelati APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Tahweelati ZIP
        run: |
          ZIP_FILE=$(find . -type f \
            -name "Tahweelati_v1.3_OriginalIcon.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP FILE NOT FOUND!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f -name "settings.gradle.kts" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android project not found inside ZIP!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             output/Tahweelati.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahweelati-APK-v1.3
          path: output/Tahweelati.apk
          if-no-files-found: error
          retention-days: 14
          
