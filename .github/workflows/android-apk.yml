
name: Build Tahweelati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Tahweelati APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK without deprecated tools package
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Install Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Find and extract project ZIP
      - name: Extract Tahweelati project
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'Tahweelati_CloudBuild_v1.3.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tahweelati ZIP file not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found project: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      # 7. Verify project files
      - name: Verify Android project
        working-directory: project/Tahweelati
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Project files verified successfully"

      # 8. Build APK
      - name: Build Tahweelati APK
        working-directory: project/Tahweelati
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      # 9. Upload APK
      - name: Upload Tahweelati APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahweelati-APK-v1.3
          path: project/Tahweelati/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
